name: Terraform Infra

on:
  push:
    branches: [main]
    paths:
      - "day1-bootstrap/**"

# Required for OIDC: this lets GitHub issue a short-lived token this job can
# exchange with Azure AD for real credentials. No stored secret involved.
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day1-bootstrap
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      # No manual approval gate here - every push to main touching
      # day1-bootstrap/** applies immediately. Fine for a solo learning
      # project; a real team would add a required-reviewer environment
      # between plan and apply.
      - name: Terraform Apply
        run: terraform apply -auto-approve
