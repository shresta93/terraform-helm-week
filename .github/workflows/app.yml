name: Build and Deploy App

on:
  push:
    branches: [main]
    paths:
      - "day4-app/**"

permissions:
  id-token: write
  contents: read

env:
  # Not secrets - just identifiers. Fill these in with your own values.
  ACR_NAME: tfhelmacrg9u9sc
  ACR_LOGIN_SERVER: tfhelmacrg9u9sc.azurecr.io
  AKS_RESOURCE_GROUP: tfhelm-rg
  AKS_CLUSTER_NAME: tfhelm-aks

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day4-app
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      # Tagged with the commit SHA, not "v1" reused forever - this is what
      # makes every deploy immutable and traceable back to an exact commit,
      # and it's what avoids the "same tag, stale pod" trap from Day 4.
      - name: Build and push image
        run: |
          IMAGE="${{ env.ACR_LOGIN_SERVER }}/task-api:${{ github.sha }}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Helm upgrade
        run: |
          helm upgrade taskapi ./taskapi-chart \
            -f values-override.yaml \
            --set image.repository=${{ env.ACR_LOGIN_SERVER }}/task-api \
            --set image.tag=${{ github.sha }}
